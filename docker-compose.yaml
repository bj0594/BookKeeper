services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bookkeeper
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookkeeper
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookkeeper -d bookkeeper"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=bookkeeper;Username=bookkeeper;Password=password"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
