# Starts the whole system: docker compose up --build -d
# The passwords are only for local development.
services:
  # PostgreSQL. The data is stored in the volume db_data, so it survives restarts and docker compose down.
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bookkeeper
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookkeeper
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookkeeper -d bookkeeper"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API. Waits until the database is healthy, and runs the migrations when it starts.
  api:
    build:
      context: .
      dockerfile: BookKeeper.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=bookkeeper;Username=bookkeeper;Password=password"
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # Calls GET /health inside the container. docker compose ps shows (healthy) or (unhealthy).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Tells Traefik to send the traffic on port 80 to this service.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  # pgAdmin on http://localhost:5050. Register the server with host db (the service name), not localhost.
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: bookkeeper@book.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - db

  # Traefik is the ingress: http://localhost goes to the API. Dashboard on http://localhost:8081/dashboard/
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  # The Blazor frontend on http://localhost:5100. Calls the API on its service name, not on localhost.
  web:
    build:
      context: .
      dockerfile: BookKeeper.Web/Dockerfile
    environment:
      ApiBaseUrl: http://api:8080/
    ports:
      - "5100:8080"
    depends_on:
      - api

volumes:
  db_data:

